# HPC base environment. Install mpi4py against the cluster MPI afterward;
# see HPC_ENV.md. Do not add Conda openmpi/mpich to this environment.
name: hpc_landlab
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - git
  - compilers
  - bmipy
  - matplotlib
  - netcdf4
  - numpy>=1.20
  - pandas
  - pyshp!=2.3.0
  - pyyaml
  - rich-click
  - scipy
  - statsmodels
  - xarray>=0.16
  - pymetis
  - meshio
  - pytest
variables:
  MPLBACKEND: Agg
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
